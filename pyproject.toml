[project]
name = "hmm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.17",
    "procrastinate==3.11.0",
    "httpx>=0.28",
    "pypdf>=6.0",
    "python-multipart>=0.0.20",
    "aioboto3>=15",
    "aiogram>=3.31",
]

[project.scripts]
hmm-worker = "hmm.worker:main"
hmm-bot = "hmm.bot.main:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty>=0.0.1a20",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"src/hmm/migrations/versions/*" = ["E501"]
"src/hmm/models.py" = ["F401"]
