name: release

on:
  push:
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/python.Dockerfile
            package: hmm-core
          - name: bot
            dockerfile: deploy/python.Dockerfile
            package: hmm-bot
          - name: parser
            dockerfile: deploy/python.Dockerfile
            package: hmm-parser
          - name: web
            dockerfile: deploy/web.Dockerfile
            package: ""
          - name: backup
            dockerfile: deploy/backup/Dockerfile
            package: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: echo "tag=ghcr.io/${OWNER,,}/hmm-${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: PACKAGE=${{ matrix.package }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          printf -v remote_path '%q' "$DEPLOY_PATH"
          printf -v remote_tag '%q' "$IMAGE_TAG"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.prod.yaml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/compose.prod.yaml"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- ${remote_path} ${remote_tag}" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          export IMAGE_TAG="$2"
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --remove-orphans --wait
          SCRIPT
