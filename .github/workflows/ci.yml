name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hmm
          POSTGRES_PASSWORD: hmm
          POSTGRES_DB: hmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmm"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hmm:hmm@127.0.0.1:5432/hmm_test
      TEST_DATABASE_URL: postgresql+psycopg://hmm:hmm@127.0.0.1:5432/hmm_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run python -m hmm_core.export_openapi --check
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q || [ $? -eq 5 ]

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/compose.yaml --profile full config --quiet
      - run: docker compose -f deploy/compose.yaml --profile full build
      - run: docker compose --env-file deploy/.env.prod.example -f deploy/compose.prod.yaml config --quiet
      - run: docker build -f deploy/web.Dockerfile .
      - run: docker build -f deploy/backup/Dockerfile .
