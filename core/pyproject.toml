[project]
name = "hmm-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "hmm-contracts",
    "hmm-algo",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.17",
    "procrastinate==3.11.0",
]

[project.scripts]
hmm-worker = "hmm_core.jobs:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
